<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI業務ランチャー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>AI業務ランチャー</h1>
    <p class="app-sub">よく使う業務をボタン化して、Claude Codeに処理させる</p>
  </header>

  <main class="app-main">
    <section class="panel task-panel">
      <h2 class="panel-title">業務を選ぶ</h2>
      <div id="task-cards" class="task-cards"></div>

      <div id="task-form" class="task-form" hidden>
        <h3 id="task-form-title"></h3>
        <textarea id="task-input" rows="10" placeholder=""></textarea>
        <div class="task-form-actions">
          <button id="run-button" type="button">実行する</button>
          <span id="run-status" class="run-status" aria-live="polite"></span>
        </div>

        <div id="result-box" class="result-box" hidden>
          <div class="result-box-header">
            <h4>結果</h4>
            <div class="result-box-actions">
              <button id="copy-button" type="button" class="ghost-button">コピー</button>
              <button id="download-button" type="button" class="ghost-button">Markdownを保存</button>
            </div>
          </div>
          <div id="result-content" class="result-content"></div>
        </div>
      </div>
    </section>

    <section class="panel history-panel">
      <div class="history-panel-header">
        <h2 class="panel-title">実行履歴</h2>
        <button id="clear-history-button" type="button" class="ghost-button">すべて削除</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <p id="history-empty" class="history-empty">まだ実行履歴はありません</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
